[project]
name = "bottega"
version = "0.1.0"
description = "A company run entirely by AI agents built on the Claude API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.8,<3", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
