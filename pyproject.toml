[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bottega"
version = "1.0.0"
description = "A small studio run entirely by AI agents built on the Claude API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "abejit-singh" }]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1", "ruff>=0.6"]

# `pip install .` adds a `bottega` command (same as `python -m bottega`).
[project.scripts]
bottega = "bottega.cli:main"

[project.urls]
Repository = "https://github.com/abejit-singh/bottega"

[tool.setuptools.packages.find]
include = ["bottega*"]

# Files that aren't Python but that the program needs at runtime.
[tool.setuptools.package-data]
"bottega.agents" = ["prompts/*.md"]
"bottega.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, modern syntax, simplifications
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The demo script embeds a whole web page and stylesheet as strings.
"bottega/demo.py" = ["E501"]
